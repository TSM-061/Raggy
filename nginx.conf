events { worker_connections 1024; }

http {
    # set default headers, gets overridden if block provides own
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 80 default_server;
        server_name localhost;

        location / {
          proxy_pass http://frontend:80;

          # for web socket hot reload
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        location /api/auth {
            proxy_pass http://auth-service:80;
        }

        location /api/uploads {
            proxy_pass http://dashboard-service:80;
        }

        location /api/search {
            proxy_pass http://rag-service:80;
        }
    }


    server {
        listen 80;
        server_name s3.localhost;

        # Increase client_max_body_size so you can actually upload large files
        client_max_body_size 100M;

        location / {
            proxy_pass http://s3:9000; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
