info:
  name: signin
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/auth/signin"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
