services:
  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql
    labels:
      - dev.dozzle.group=storage
    healthcheck:
      # required so migrations aren't run before postgres initializes
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  auth-db-migrations:
    image: ghcr.io/kukymbr/goose-docker:latest
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:auth_password@auth-db:5432/postgres
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_COMMAND: up
    volumes:
      - "../services/simple-auth-service/internal/migrations:/migrations"
    labels:
      - dev.dozzle.group=init
    depends_on:
      auth-db:
        condition: service_healthy

  dashboard-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dashboard_password
    ports:
      - "5433:5432"
    volumes:
      - dashboard_db_data:/var/lib/postgresql
    labels:
      - dev.dozzle.group=storage
    healthcheck:
      # required so migrations aren't run before postgres initializes
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5


  dashboard-db-migrations:
    image: ghcr.io/kukymbr/goose-docker:latest
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:dashboard_password@dashboard-db:5432/postgres
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_COMMAND: up
    volumes:
      - "../services/dashboard/internal/migrations:/migrations"
    labels:
      - dev.dozzle.group=init
    depends_on:
      dashboard-db:
        condition: service_healthy

  rag-db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5434:5432"
    volumes:
      - rag_db_data:/var/lib/postgresql
    labels:
      - dev.dozzle.group=storage
    healthcheck:
      # required so migrations aren't run before postgres initializes
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  rag-db-migrations:
    image: ghcr.io/kukymbr/goose-docker:latest
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:rag_password@rag-db:5432/postgres
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_COMMAND: up
    volumes:
      - "../services/rag/internal/migrations:/migrations"
    labels:
      - dev.dozzle.group=init
    depends_on:
      rag-db:
        condition: service_healthy

volumes:
  auth_db_data:
  dashboard_db_data:
  rag_db_data:
