name: raggy

services:
  proxy:
    image: nginx:alpine
    container_name: raggy-proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service

  auth-db:
    image: postgres:16-alpine
    container_name: raggy-auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../
      dockerfile: services/simple-auth-service/dev.Dockerfile
    container_name: raggy-auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      ENV: dev
      PORT: 80
      DB_CONNECTION_STRING: "postgres://auth_user:auth_password@auth-db:5432/auth_db?sslmode=disable"
      AUTH_PASSWORD_PEPPER: "raggy-secret-pepper-2026"
      ARGON3_KEY_LENGTH: 32
      ARGON2_MEMORY: 6553
    volumes:
      - "../:/app"
