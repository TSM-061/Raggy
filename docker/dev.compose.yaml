name: raggy

services:
  proxy:
    image: nginx:alpine
    container_name: raggy-proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service

  auth-database:
    image: postgres:18-alpine
    container_name: raggy-auth-database
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - auth-database:/var/lib/postgresql

  auth-service:
    build:
      context: ../
      dockerfile: services/simple-auth-service/dev.Dockerfile
    container_name: raggy-auth-service
    depends_on:
      - auth-database
    environment:
      ENV: development
      DB_CONNECTION_STRING: postgres://postgres:auth_password@auth-database:5432/postgres
    env_file:
      - ../services/simple-auth-service/.env.example
    volumes:
      - "../:/app"
      - auth-service-packages:/go/pkg/mod

volumes:
  auth-service-packages:
  auth-database:
